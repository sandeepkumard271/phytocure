<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="potatoLeaf" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <linearGradient id="waterSoaked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#3f3f46"/>
      <stop offset="80%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="moldDust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#e2e8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#f1f5f9" rx="16"/>
  <rect x="12" y="12" width="376" height="376" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Stem -->
  <path d="M 200,370 Q 202,280 200,100" stroke="#064e3b" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Potato Leaf Blade (Ovate, slightly undulating) -->
  <path d="M 200,70 
           C 260,90 310,150 300,240 
           C 290,290 250,340 200,360 
           C 150,340 110,290 100,240 
           C 90,150 140,90 200,70 Z" 
        fill="url(#potatoLeaf)" stroke="#047857" stroke-width="2"/>

  <!-- Veins -->
  <path d="M 200,70 L 200,360" stroke="#a7f3d0" stroke-width="3" opacity="0.6"/>
  <path d="M 200,140 Q 240,160 280,180" stroke="#a7f3d0" stroke-width="1.8" opacity="0.5" fill="none"/>
  <path d="M 200,140 Q 160,160 120,180" stroke="#a7f3d0" stroke-width="1.8" opacity="0.5" fill="none"/>
  <path d="M 200,210 Q 245,230 285,250" stroke="#a7f3d0" stroke-width="1.8" opacity="0.5" fill="none"/>
  <path d="M 200,210 Q 155,230 115,250" stroke="#a7f3d0" stroke-width="1.8" opacity="0.5" fill="none"/>

  <!-- Late Blight Water-Soaked Necrotic Blotches (Irregular, wet look) -->
  <path d="M 200,75 C 240,80 280,110 285,150 C 260,180 220,160 210,130 C 190,110 180,90 200,75 Z" 
        fill="url(#waterSoaked)" opacity="0.95"/>
  <circle cx="250" cy="120" r="15" fill="url(#moldDust)"/>
  <circle cx="230" cy="140" r="12" fill="url(#moldDust)"/>

  <!-- Major Side Blotch -->
  <path d="M 105,200 C 140,190 170,220 160,260 C 130,290 95,270 105,200 Z" 
        fill="url(#waterSoaked)" opacity="0.92"/>
  <circle cx="135" cy="235" r="16" fill="url(#moldDust)"/>

  <!-- Tip collapse -->
  <ellipse cx="260" cy="280" rx="35" ry="25" fill="url(#waterSoaked)" opacity="0.88"/>

  <!-- Caption badge -->
  <rect x="25" y="25" width="165" height="30" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Potato: Late Blight</text>
  <text x="330" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sample #2</text>
</svg>
