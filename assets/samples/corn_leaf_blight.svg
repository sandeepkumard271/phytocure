<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cornLeaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="25%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="75%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="cigarLesion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="20%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f1f5f9" rx="16"/>
  <rect x="12" y="12" width="376" height="376" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Long strap-like maize leaf -->
  <path d="M 200,40 
           C 240,100 270,220 250,370 
           L 150,370 
           C 130,220 160,100 200,40 Z" 
        fill="url(#cornLeaf)" stroke="#166534" stroke-width="2"/>

  <!-- Parallel Venation -->
  <line x1="200" y1="40" x2="200" y2="370" stroke="#fef08a" stroke-width="3" opacity="0.8"/>
  <line x1="185" y1="60" x2="175" y2="370" stroke="#86efac" stroke-width="1" opacity="0.5"/>
  <line x1="215" y1="60" x2="225" y2="370" stroke="#86efac" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="100" x2="160" y2="370" stroke="#86efac" stroke-width="1" opacity="0.4"/>
  <line x1="230" y1="100" x2="240" y2="370" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Characteristic cigar-shaped elongated lesions (Northern Corn Leaf Blight) -->
  <!-- Lesion 1 -->
  <rect x="160" y="140" width="30" height="110" rx="15" fill="url(#cigarLesion)"/>
  <rect x="165" y="155" width="20" height="80" rx="10" fill="#291305" opacity="0.6"/>

  <!-- Lesion 2 -->
  <rect x="210" y="210" width="28" height="95" rx="14" fill="url(#cigarLesion)"/>
  <rect x="215" y="225" width="18" height="65" rx="9" fill="#291305" opacity="0.6"/>

  <!-- Lesion 3 (smaller) -->
  <rect x="180" y="70" width="18" height="55" rx="9" fill="url(#cigarLesion)"/>

  <!-- Caption badge -->
  <rect x="25" y="25" width="175" height="30" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Corn: Leaf Blight</text>
  <text x="330" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sample #4</text>
</svg>
