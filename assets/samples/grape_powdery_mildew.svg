<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="grapeLeaf" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="powderyPatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f1f5f9" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#cbd5e1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#f1f5f9" rx="16"/>
  <rect x="12" y="12" width="376" height="376" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Grape stem -->
  <path d="M 200,370 Q 205,320 200,270" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Palmate 3-lobed Grape Leaf Shape -->
  <path d="M 200,80 
           C 220,95 240,85 270,110 
           C 260,130 280,150 310,170 
           C 295,190 300,210 320,240 
           C 290,250 270,270 260,300 
           C 240,290 220,310 200,315 
           C 180,310 160,290 140,300 
           C 130,270 110,250 80,240 
           C 100,210 105,190 90,170 
           C 120,150 140,130 130,110 
           C 160,85 180,95 200,80 Z" 
        fill="url(#grapeLeaf)" stroke="#166534" stroke-width="2"/>

  <!-- Palmate venation radiating from base -->
  <path d="M 200,315 L 200,80" stroke="#86efac" stroke-width="2.5" opacity="0.6"/>
  <path d="M 200,315 Q 240,220 290,140" stroke="#86efac" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M 200,315 Q 160,220 110,140" stroke="#86efac" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M 200,315 Q 260,270 315,235" stroke="#86efac" stroke-width="1.8" opacity="0.5" fill="none"/>
  <path d="M 200,315 Q 140,270 85,235" stroke="#86efac" stroke-width="1.8" opacity="0.5" fill="none"/>

  <!-- White powdery mildew patches covering surface -->
  <circle cx="160" cy="180" r="45" fill="url(#powderyPatch)"/>
  <circle cx="230" cy="160" r="50" fill="url(#powderyPatch)"/>
  <circle cx="200" cy="230" r="40" fill="url(#powderyPatch)"/>
  <circle cx="270" cy="210" r="32" fill="url(#powderyPatch)"/>
  <circle cx="130" cy="230" r="35" fill="url(#powderyPatch)"/>

  <!-- Caption badge -->
  <rect x="25" y="25" width="180" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Grape: Powdery Mildew</text>
  <text x="330" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sample #5</text>
</svg>
