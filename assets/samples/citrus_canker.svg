<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="citrusLeaf" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="cankerCrater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <radialGradient id="oilyHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="1"/>
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#f1f5f9" rx="16"/>
  <rect x="12" y="12" width="376" height="376" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Citrus Winged Petiole Stem -->
  <path d="M 200,370 L 200,320" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="200" cy="330" rx="10" ry="16" fill="#15803d"/>

  <!-- Glossy Elliptic Citrus Leaf -->
  <path d="M 200,70 
           C 270,110 310,180 290,260 
           C 270,310 230,320 200,320 
           C 170,320 130,310 110,260 
           C 90,180 130,110 200,70 Z" 
        fill="url(#citrusLeaf)" stroke="#14532d" stroke-width="2"/>

  <!-- Midrib and Fine Veins -->
  <path d="M 200,75 L 200,320" stroke="#86efac" stroke-width="2.5" opacity="0.7"/>
  <path d="M 200,120 Q 235,140 270,155" stroke="#86efac" stroke-width="1.2" opacity="0.5" fill="none"/>
  <path d="M 200,120 Q 165,140 130,155" stroke="#86efac" stroke-width="1.2" opacity="0.5" fill="none"/>
  <path d="M 200,180 Q 240,200 280,215" stroke="#86efac" stroke-width="1.2" opacity="0.5" fill="none"/>
  <path d="M 200,180 Q 160,200 120,215" stroke="#86efac" stroke-width="1.2" opacity="0.5" fill="none"/>
  <path d="M 200,240 Q 235,255 265,270" stroke="#86efac" stroke-width="1.2" opacity="0.5" fill="none"/>
  <path d="M 200,240 Q 165,255 135,270" stroke="#86efac" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- Raised Corky Canker Lesions with bright yellow oily halos -->
  <!-- Spot 1 -->
  <circle cx="230" cy="150" r="28" fill="url(#oilyHalo)"/>
  <circle cx="230" cy="150" r="14" fill="url(#cankerCrater)"/>
  <circle cx="230" cy="150" r="6" fill="#1c1917"/>

  <!-- Spot 2 -->
  <circle cx="160" cy="200" r="24" fill="url(#oilyHalo)"/>
  <circle cx="160" cy="200" r="11" fill="url(#cankerCrater)"/>
  <circle cx="160" cy="200" r="4" fill="#1c1917"/>

  <!-- Spot 3 -->
  <circle cx="220" cy="240" r="22" fill="url(#oilyHalo)"/>
  <circle cx="220" cy="240" r="10" fill="url(#cankerCrater)"/>

  <!-- Spot 4 -->
  <circle cx="150" cy="130" r="16" fill="url(#oilyHalo)"/>
  <circle cx="150" cy="130" r="7" fill="url(#cankerCrater)"/>

  <!-- Caption badge -->
  <rect x="25" y="25" width="160" height="30" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Citrus: Citrus Canker</text>
  <text x="330" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sample #6</text>
</svg>
