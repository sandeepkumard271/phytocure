<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="healthyVigor" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f1f5f9" rx="16"/>
  <rect x="12" y="12" width="376" height="376" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Healthy Petiole / Stem -->
  <path d="M 200,370 Q 202,300 198,110" stroke="#15803d" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Perfect Pristine Leaf Blade -->
  <path d="M 198,70 
           C 275,100 325,180 305,270 
           C 285,330 235,355 198,365 
           C 160,355 110,330 90,270 
           C 70,180 120,100 198,70 Z" 
        fill="url(#healthyVigor)" stroke="#166534" stroke-width="2.5"/>

  <!-- Glossy cuticle sheen highlight -->
  <path d="M 198,75 
           C 240,100 270,150 260,220 
           C 230,230 210,180 200,120 Z" 
        fill="url(#sheen)"/>

  <!-- Vibrant Healthy Vein Architecture -->
  <path d="M 198,70 L 198,365" stroke="#bbf7d0" stroke-width="3" opacity="0.8"/>
  <path d="M 198,130 Q 240,145 285,160" stroke="#bbf7d0" stroke-width="2" opacity="0.7" fill="none"/>
  <path d="M 198,130 Q 155,145 110,160" stroke="#bbf7d0" stroke-width="2" opacity="0.7" fill="none"/>
  <path d="M 198,190 Q 250,205 295,225" stroke="#bbf7d0" stroke-width="2" opacity="0.7" fill="none"/>
  <path d="M 198,190 Q 145,205 100,225" stroke="#bbf7d0" stroke-width="2" opacity="0.7" fill="none"/>
  <path d="M 198,255 Q 240,270 275,290" stroke="#bbf7d0" stroke-width="1.8" opacity="0.7" fill="none"/>
  <path d="M 198,255 Q 155,270 120,290" stroke="#bbf7d0" stroke-width="1.8" opacity="0.7" fill="none"/>

  <!-- Caption badge -->
  <rect x="25" y="25" width="165" height="30" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">Status: Healthy Foliage</text>
  <text x="330" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sample #8</text>
</svg>
